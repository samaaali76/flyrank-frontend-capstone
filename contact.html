<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact me — send a message through my portfolio contact form.">
  <title>Contact | Portfolio</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <main class="contact-page">
    <section class="contact-form" aria-labelledby="contact-heading">
      <header class="contact-form__header">
        <h1 id="contact-heading" class="contact-form__title">Get in Touch</h1>
        <p class="contact-form__subtitle">Have a question or want to work together? Send me a message.</p>
      </header>

      <form class="contact-form__form" id="contact-form" novalidate>
        <div class="contact-form__field">
          <label class="contact-form__label" for="contact-name">Name</label>
          <input
            class="contact-form__input"
            type="text"
            id="contact-name"
            name="name"
            autocomplete="name"
            required
            minlength="2"
            aria-describedby="contact-name-error"
          >
          <span class="contact-form__error" id="contact-name-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="contact-email">Email</label>
          <input
            class="contact-form__input"
            type="email"
            id="contact-email"
            name="email"
            autocomplete="email"
            required
            aria-describedby="contact-email-error"
          >
          <span class="contact-form__error" id="contact-email-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="contact-message">Message</label>
          <textarea
            class="contact-form__input contact-form__input--textarea"
            id="contact-message"
            name="message"
            rows="5"
            required
            minlength="10"
            aria-describedby="contact-message-error"
          ></textarea>
          <span class="contact-form__error" id="contact-message-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="contact-form__actions">
          <button class="contact-form__submit" type="submit" id="contact-submit">Send Message</button>
        </div>

        <p class="contact-form__success" id="contact-success" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
  </main>

  <script src="contact.js"></script>
</body>
</html>
